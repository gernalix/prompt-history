schema_version: c2.project-capsule.v1
identity:
  project_id: 103
  slug: prompt-history
  repository_id: R0104
scope:
  purpose: Maintain a derived, rebuildable prompt-evidence warehouse with deterministic
    provenance, without mutating canonical inputs.
  boundaries:
  - No network ingestion or canonical source mutations are authorized by capsule verification.
  - Historical Pn/C2 data are archive inputs only; do not activate lifecycle dispatchers.
repository:
  canonical_workdir: /home/daniele/projects/prompt-history
  branch_policy: Use isolated task worktrees and the installed single writer; protect
    the current primary branch and preserve all valid work.
architecture:
  summary: store.py owns normalized entities and SQLite/FTS persistence; adapters.py
    and chatgpt_adapters.py own input normalization with a tested public compatibility
    boundary. incremental.py tracks source fingerprints/checkpoints; maintenance.py
    owns guarded derived-store maintenance. cli.py composes these modules. Browser
    extension/research capture remains explicit and separately bounded.
  entrypoints:
  - prompt_history/cli.py
  important_paths:
  - prompt_history
  - schema/prompt_evidence.sql
  - queries
  - extension
  - research
  - tests
  - README.md
dependencies:
- name: Python standard library and system SQLite
  purpose: Offline policy, data and fixture verification.
- name: Bubblewrap
  purpose: Read-only source with private temporary home/runtime/data, isolated processes
    and network.
- name: Node and installed Chrome
  purpose: Synthetic local extension capture probe inside the isolated namespace;
    no real browser profile or provider requests.
data:
  schema: Derived SQLite stores prompts, executions, relations, artifacts, immutable
    source_records and prompt_fts. schema/prompt_evidence.sql is the schema reference.
    Native exports and source lifecycle/history remain canonical; analyses preserve
    provenance and report sample counts.
  migrations: Use owning store/maintenance APIs, consistent SQLite backup and source
    checkpoints. Rebuild only the derived warehouse; never rewrite canonical source
    history or outcomes to fit later conclusions.
runtime:
  services:
  - prompt-history-sync.service
  - prompt-history-transcripts.service
  timers:
  - prompt-history-sync.timer
  - prompt-history-transcripts.timer
  containers: []
devices: []
commands:
  setup:
    not_applicable: Use existing global runtime/test dependencies; no venv, live data
      ingestion or host provisioning is part of verification.
  build:
    not_applicable: Python source has no required compiled build.
