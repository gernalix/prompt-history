  deploy_install:
    not_applicable: Use the existing project installer and specialist operations only
      within a separately requested deployment scope.
  smoke:
    not_applicable: Live sources, browser/compositor sessions and private data operations
      are not capsule hooks.
  verify:
    fast:
      argv:
      - python3
      - /home/daniele/projects/codex-roadmap/tools/project_capsule.py
      - --repo
      - .
      - --mode
      - FAST
      cwd: .
    full:
      argv:
      - python3
      - /home/daniele/projects/codex-roadmap/tools/project_capsule.py
      - --repo
      - .
      - --mode
      - FULL
      cwd: .
safety:
  invariants:
  - Keep private exports and generated databases outside Git and test output.
  - Preserve deterministic idempotence, canonical prompt identity and every ingested
    record provenance.
  - Do not substitute redacted or partial text for a better canonical source; keep
    historical evidence.
  risky_operations:
  - Installation, real capture/ingestion, source recovery and live desktop/browser
    operations require their own requested scope.
  recovery:
  - Preserve original data and prior good states. Use owning semantic writers and
    consistent SQLite backups for applicable stores.
acceptance:
- FAST validates identity, source paths, executable commands and reviewed-source freshness.
- FULL runs the declared isolated fixture suite; original data, credentials and desktop/browser
  sessions remain inaccessible.
- Live archive completeness, compositor behavior, browser-extension E2E and installed
  runtime are separate checks, not inferred from a capsule PASS.
references:
  megavault: /home/daniele/MegaVault/megavault.sqlite
  c2: Historical-only /home/daniele/projects/codex-roadmap/roadmap.sqlite; no lifecycle
    writes or dispatcher use.
freshness:
  reviewed_commit: 7375f0ed7df4e81ddf97c93573b7c1affbefe0ff
  watch_paths:
  - prompt_history
  - schema
  - queries
  - extension
  - research
  - tools
  - systemd
